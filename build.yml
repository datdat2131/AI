name: Build AstraxAI

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Maven da duoc cai san tren ubuntu-latest; buoc nay xac nhan phien ban dang dung.
      - name: Show Maven and Java versions
        run: mvn -version

      - name: Build with Maven
        run: mvn -B clean package

      - name: Upload AstraxAI.jar
        uses: actions/upload-artifact@v4
        with:
          name: AstraxAI
          path: target/AstraxAI.jar
          if-no-files-found: error
