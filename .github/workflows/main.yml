name: Build AstraxAI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn clean package

      - name: Upload AstraxAI Jar
        uses: actions/upload-artifact@v4
        with:
          name: AstraxAI
          path: target/*.jar
          if-no-files-found: error
          retention-days: 14
