# =====================================================================
# AstraxAI - Dữ liệu kiến thức về server
#
# AI chỉ dùng file này để trả lời về server của bạn (rank, boss, relic...).
# Nếu thông tin không có trong file, AI sẽ nói là không biết thay vì bịa.
#
# NỘI DUNG BÊN DƯỚI CHỈ LÀ VÍ DỤ - HÃY THAY BẰNG DỮ LIỆU THẬT CỦA SERVER.
# Bạn có thể thêm/bớt mục tùy ý, mỗi mục có thể lồng nhau.
# Dùng /astraai reload để áp dụng thay đổi.
#
# CẢNH BÁO: Toàn bộ nội dung file này được gửi tới dịch vụ AI. Đừng đặt
# mật khẩu, token, IP riêng tư hay thông tin nhạy cảm vào đây.
# =====================================================================

server:
