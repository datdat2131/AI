# =====================================================================
# AstraxAI - Bảng giá Rank và thông tin thanh toán
# Người chơi hỏi về rank/nạp tiền (hoặc bấm "Hỏi về Rank" trong menu) sẽ
# được mở menu rank thay vì chờ AI trả lời. Sửa xong dùng /astraai reload.
# Dùng dấu cách để thụt lề, không dùng Tab.
# =====================================================================

enabled: true

# Khi người chơi gõ /ai có chữ như rank, nạp, donate, bảng giá, bank...
# thì mở thẳng menu rank (không tốn lượt gọi API).
intercept-chat: true

# Link ảnh mã QR (phải bắt đầu bằng https://). Để trống nếu chưa có.
# Tải ảnh QR lên imgur/ibb rồi dán link vào đây. Người chơi sẽ thấy nút bấm để mở.
qr-url: ""

# Link Discord để người chơi liên hệ staff (https://...). Để trống nếu chưa có.
discord-url: ""

